name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  test:
    name: unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: unit tests
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout 5m

  integration:
    name: integration (compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: start dependencies
        run: docker compose -f deploy/compose/docker-compose.yml up -d redis
      - name: wait for redis
        run: |
          for i in $(seq 1 30); do
            if docker compose -f deploy/compose/docker-compose.yml exec -T redis redis-cli ping | grep -q PONG; then
              echo "redis ready"; exit 0
            fi
            sleep 1
          done
          echo "redis did not become ready"; exit 1
      - name: integration tests
        run: go test -race -count=1 -tags=integration ./test/integration/...
        env:
          WAYPOINT_REDIS_ADDR: localhost:6379
      - name: stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs
      - name: teardown
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  build-images:
    name: build images
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: build gateway image
        run: docker build -f deploy/compose/Dockerfile.gateway -t waypoint/gateway:ci .
      - name: build mock backend image
        run: docker build -f deploy/compose/Dockerfile.mockbackend -t waypoint/mockbackend:ci .
