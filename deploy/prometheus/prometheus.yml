global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: waypoint-gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: mock-backends
    static_configs:
      - targets: ["mock-1:9001", "mock-2:9001", "mock-3:9001"]
    metrics_path: /metrics
