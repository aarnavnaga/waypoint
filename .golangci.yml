version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - goconst
    - gocritic
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
        - performance
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test files use httptest helpers and short-lived clients where the
      # context and body-close linters are noise rather than signal: the server
      # is torn down by t.Cleanup and the request lifetime is the test's.
      - linters:
          - goconst
          - gocritic
          - unparam
          - noctx
          - bodyclose
          - contextcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
